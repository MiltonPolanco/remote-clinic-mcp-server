[project]
name = "remote-clinic-mcp-server"
version = "0.1.0"
description = "Remote MCP server for a fictional clinic laboratory preparation catalog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
]

[project.scripts]
remote-clinic-mcp = "remote_clinic_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_clinic_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

